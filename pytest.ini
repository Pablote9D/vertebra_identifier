[pytest]
testpaths = tests
pythonpath = .
# dash (dependencia de Open3D) registra un plugin de pytest que no se usa
addopts = -p no:dash
# aviso interno de starlette sobre su cliente de pruebas, ajeno al proyecto
filterwarnings =
    ignore::DeprecationWarning:fastapi.testclient
    ignore:Using .httpx. with .starlette.testclient.
